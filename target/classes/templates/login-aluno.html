<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login Aluno — EEEP</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:       #080b12;
            --surface:  #0e1320;
            --border:   #1c2340;
            --accent:   #00c9a7;
            --accent-h: #00a88c;
            --accent-dim: #00c9a715;
            --danger:   #ff5c5c;
            --text:     #eef0f8;
            --muted:    #5a6282;
            --input-bg: #080b12;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            font-family: 'Outfit', sans-serif;
            color: var(--text);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 48px 48px;
            opacity: .3;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 60% 60% at 50% 40%, #00c9a70a 0%, transparent 65%);
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 10;
            width: min(440px, 92vw);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 32px 80px #00000070;
            animation: rise .5s cubic-bezier(.22,1,.36,1) both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(32px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: .82rem;
            color: var(--muted);
            text-decoration: none;
            margin-bottom: 32px;
            transition: color .2s;
        }
        .back:hover { color: var(--accent); }

        .profile-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent-dim);
            border: 1px solid #00c9a730;
            border-radius: 100px;
            padding: 6px 14px 6px 10px;
            font-size: .82rem;
            color: var(--accent);
            font-weight: 500;
            margin-bottom: 24px;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 1.9rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .sub {
            color: var(--muted);
            font-size: .9rem;
            font-weight: 300;
            margin-bottom: 36px;
        }

        .field { margin-bottom: 18px; }

        label {
            display: block;
            font-size: .75rem;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px 16px;
            background: var(--input-bg);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            font-size: .95rem;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px #00c9a720;
        }

        .erro {
            background: #ff5c5c12;
            border: 1px solid #ff5c5c40;
            color: var(--danger);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: .87rem;
            margin-bottom: 20px;
        }

        .sucesso {
            background: #00c9a712;
            border: 1px solid #00c9a740;
            color: var(--accent);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: .87rem;
            margin-bottom: 20px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #080b12;
            font-family: 'Syne', sans-serif;
            font-size: .95rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background .2s, transform .15s;
            margin-top: 6px;
            letter-spacing: .02em;
        }

        .btn:hover  { background: var(--accent-h); }
        .btn:active { transform: scale(.98); }

        .footer-link {
            text-align: center;
            margin-top: 28px;
            font-size: .85rem;
            color: var(--muted);
        }

        .footer-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <a th:href="@{/}" href="/" class="back">← Voltar à seleção</a>

    <div class="profile-chip">🎒 Aluno</div>

    <h1>Acesso Estudantil</h1>
    <p class="sub">Entre com sua matrícula e senha</p>

    <div class="sucesso" th:if="${param.cadastrado}">Cadastro realizado! Faça o login.</div>
    <div class="erro"    th:if="${erro}" th:text="${erro}"></div>

    <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" th:field="*{email}"
               placeholder="seu@email.com" required/>
    </div>
        <div class="field">
            <label for="senha">Senha</label>
            <input type="password" id="senha" th:field="*{senha}"
                   placeholder="••••••••" required/>
        </div>
        <button type="submit" class="btn">Entrar</button>
    </form>

    <div class="footer-link">
        Não tem conta? <a th:href="@{/cadastro/aluno}">Cadastre-se</a>
    </div>
</div>
</body>
</html>
